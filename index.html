<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>RotaPro</title></head><body><header>🚚 <b>RotaPro</b></header><main><section class="card"><h2>Minha rota</h2><div class="stats"><div><b id="total">0</b><small>Entregas</small></div><div><b id="done">0</b><small>Concluídas</small></div><div><b id="remaining">0</b><small>Pendentes</small></div></div><div class="bar"><i id="progress"></i></div></section><section class="card"><h3>Adicionar entrega</h3><input id="client" placeholder="Nome do cliente"><input id="address" placeholder="Endereço completo"><input id="phone" placeholder="Telefone"><button onclick="add()">Adicionar</button><label class="btn">📥 Importar CSV<input type="file" accept=".csv" onchange="importCSV(event)"></label></section><section class="card"><h3>Entregas</h3><div id="list"></div></section></main><script src="app.js"></script></body></html>
