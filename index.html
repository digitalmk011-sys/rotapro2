<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css"><title>RotaPro</title></head>
<body>
<header><b>🚚 RotaPro</b><span>● online</span></header>
<main>
<section class="card"><h1>Minha rota</h1>
<div class="stats"><div><b id="total">0</b><small>Entregas</small></div><div><b id="done">0</b><small>Concluídas</small></div><div><b id="remaining">0</b><small>Pendentes</small></div></div>
<div class="progress"><i id="bar"></i></div></section>
<section class="card"><h2>Adicionar entrega</h2>
<input id="client" placeholder="Nome do cliente"><input id="address" placeholder="Endereço completo"><input id="phone" placeholder="Telefone (opcional)">
<button onclick="addDelivery()">Adicionar</button>
<div class="row">
<label class="file">📊 Importar Excel/CSV<input id="file" type="file" accept=".xlsx,.xls,.csv" onchange="importFile(event)"></label>
<button class="secondary" onclick="downloadTemplate()">📄 Modelo Excel</button>
<button class="secondary" onclick="clearAll()">Limpar</button></div>
<p class="hint">Formato: Cliente, Endereço, Telefone, Observação.</p>
</section>
<section class="card"><h2>Entregas</h2><div id="list"></div></section>
</main>
<nav><button>📋<small>Entregas</small></button><button onclick="optimize()">🧭<small>Otimizar</small></button><button onclick="exportCSV()">📤<small>Exportar</small></button></nav>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="app.js"></script></body></html>
